<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дашборд продавца Ozon · демо</title>
<style>
:root{color-scheme:dark;--bg:#101319;--rail:#13171f;--panel:#181d26;--line:#2a313e;--text:#edf0f7;--muted:#a1aabd;--accent:#a2ebd0;--accent-bg:#253b39;--warn:#f2d49a;--radius:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,"Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}button,input,select{font:inherit}button,a,input,select{outline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent)}button{cursor:pointer}a{color:inherit;text-decoration:none}h1,h2,p{margin:0}h1{font-size:clamp(30px,4vw,42px);letter-spacing:-.046em;line-height:1.12}h2{font-size:17px;letter-spacing:-.017em}small,.muted{color:var(--muted)}
.layout{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:100vh}.rail{background:var(--rail);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:27px 16px 18px}.brand{display:flex;gap:11px;align-items:center;margin:0 8px 33px}.mark{width:37px;height:37px;border-radius:10px;background:var(--accent);color:#172c27;display:grid;place-items:center;font-weight:850;font-size:17px;letter-spacing:-.09em}.brand strong{display:block;line-height:1.2}.brand small{font-size:12px}.nav{display:grid;gap:4px}.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:var(--muted);font-weight:600;white-space:nowrap}.nav a:hover{background:#202633;color:var(--text)}.nav a[aria-current=page]{background:var(--accent-bg);color:var(--accent)}.nav i{font:17px/1 system-ui;width:20px;text-align:center}.rail-foot{margin-top:auto;padding:15px 9px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{display:inline-block;height:7px;width:7px;border-radius:50%;background:var(--warn);flex:none}
main{max-width:1510px;width:100%;padding:30px clamp(18px,3vw,44px) 46px;margin:0 auto}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:28px}.topline strong{color:var(--text);font-weight:600}.demo{border:1px solid #3f5651;color:var(--accent);background:#1d2e2c;border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap}.head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.head p{color:var(--muted);margin-top:7px}.btn{min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#222936;color:var(--text);font-weight:600;white-space:nowrap}.btn:hover{background:#30394a}.btn.primary{background:var(--accent);color:#192b27;border-color:var(--accent)}.btn.primary:hover{background:#baf3df}.btn[aria-pressed=true]{background:var(--accent-bg);color:var(--accent);border-color:#47665d}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}.toolbar .dates{color:var(--muted);margin-left:auto;font-size:13px}.check{display:flex;align-items:center;gap:7px;color:var(--muted);white-space:nowrap}.check input{accent-color:var(--accent);width:16px;height:16px}.period-caption{color:var(--muted);font-size:12px;margin:-3px 0 16px;text-align:right}.custom{display:flex;align-items:end;gap:9px;flex-wrap:wrap;margin-bottom:15px}.banner{display:flex;gap:11px;align-items:flex-start;border:1px solid #544834;background:#29251f;border-radius:10px;padding:12px 14px;margin:17px 0;color:#e6d7ba}.banner .dot{margin-top:7px}.banner strong{color:var(--warn)}.banner a{text-decoration:underline;text-underline-offset:3px}.banner p{flex:1}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}.card{padding:14px;min-height:108px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:5px}.card span{font-weight:600}.card strong{font-size:22px;line-height:1;color:#bbc3d2;font-weight:650;letter-spacing:-.035em}.card small{font-size:12px}.panel{padding:17px;margin-bottom:13px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:13px}.panel-head h2{margin:0}.twocol{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:12px}.chart{min-height:180px;position:relative;display:grid;place-items:center;text-align:center;border:1px solid var(--line);border-radius:9px;background:repeating-linear-gradient(to bottom,transparent 0 43px,#272f3c 43px 44px),#151a23;padding:14px}.chart .empty{background:#181d26;border:1px solid var(--line);border-radius:9px;padding:12px 18px}.empty strong{display:block}.empty small{display:block;margin-top:3px}.axis{display:flex;justify-content:space-between;gap:5px;color:var(--muted);font-size:11px;margin-top:7px}.source-row{display:flex;justify-content:space-between;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}.source-row:last-child{border-bottom:0}.source-row span:last-child{color:var(--muted);font-size:12px;text-align:right}.scroll{overflow:auto}.scroll:focus-visible{outline:2px solid var(--accent)}table{border-collapse:collapse;width:100%;min-width:570px;text-align:left}th,td{border-bottom:1px solid var(--line);padding:11px 10px}th{color:var(--muted);font-size:12px;white-space:nowrap}td.empty-cell{text-align:center;color:var(--muted);padding:35px 10px}.search{max-width:100%;width:222px}input:not([type=checkbox]),select{padding:8px 10px;background:#121720;border:1px solid #384252;border-radius:8px;color:var(--text);min-height:37px}input[type=file]{max-width:100%}label.field{display:grid;gap:5px;color:var(--muted);font-size:13px}label.field small{font-size:11px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:12px 0 15px}.fields input{min-width:0;width:100%}.switches{display:flex;flex-wrap:wrap;gap:12px 20px;margin:15px 0}.section-note{color:var(--muted);margin:0 0 12px}.toast{position:fixed;bottom:18px;right:18px;max-width:min(420px,calc(100% - 36px));padding:11px 15px;border-radius:10px;background:#243532;color:#e3f9ef;border:1px solid #55746c;z-index:2;box-shadow:0 8px 25px #0007}.toast:empty{display:none}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
@media(max-width:1100px){.layout{grid-template-columns:189px minmax(0,1fr)}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.toolbar .dates{margin-left:0}.period-caption{text-align:left}}
@media(max-width:800px){.layout{display:block}.rail{height:auto;z-index:1;padding:11px 14px 7px;border-bottom:1px solid var(--line);border-right:0}.brand{margin:0 0 8px}.mark{width:31px;height:31px}.nav{display:flex;overflow-x:auto;padding-bottom:3px}.nav a{padding:8px 10px;gap:6px}.nav i{font-size:14px;width:auto}.rail-foot{display:none}main{padding-top:16px}.topline{padding-bottom:11px;margin-bottom:17px}.twocol{grid-template-columns:1fr}}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-height:94px;padding:11px}.card strong{font-size:18px}.head{align-items:start}.head .btn{font-size:12px;padding:6px 8px}.panel{padding:12px}.toolbar .dates{flex-basis:100%}.fields{grid-template-columns:1fr}.axis span:nth-child(even){display:none}}
</style>
</head>
<body>
<div class="layout">
<aside class="rail">
  <div class="brand"><div class="mark" aria-hidden="true">OZ</div><div><strong>Ozon · аналитика</strong><small>Кабинет продавца</small></div></div>
  <nav class="nav" id="nav" aria-label="Разделы дашборда"></nav>
  <div class="rail-foot"><span class="dot" aria-hidden="true"></span>Источники не подключены</div>
</aside>
<main id="main">
  <div class="topline"><strong>Управление магазином</strong><span class="demo">Демонстрационная версия</span></div>
  <div id="view"></div>
</main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
const pages = {
  overview: ["Обзор", "Заказы, выручка и состояние магазина", "◫"],
  sales: ["Продажи", "Динамика заказов, суммы заказанного и среднего чека", "↗"],
  products: ["Товары", "Продажи, прибыль и отзывы по артикулам", "▤"],
  ads: ["Реклама", "Расходы и отдача по кампаниям и товарам", "◎"],
  inventory: ["Остатки", "Запас товаров и потребность в пополнении", "▦"],
  finance: ["Финансы", "Начисления, расходы и прибыль", "₽"],
  alerts: ["Уведомления", "События и правила оповещения", "◇"],
  settings: ["Настройки", "Подключения, расписание и себестоимость", "⚙"],
};
const metrics = {
  overview: ["Заказы","Сумма заказанного","Чистая прибыль","Расходы Ozon","Рекламный расход","ROAS","Возвраты","Отмены","Критичные остатки","Рейтинг продавца"],
  sales: ["Заказы","Сумма заказанного","Средний чек","Заказанные штуки","Сессии с просмотром","Добавления в корзину"],
  ads: ["Расход","Клики","Заказы из рекламы","ДРР","ROAS","Продажи из рекламы"],
  inventory: ["Критичные остатки","Доступно к продаже","Товары с запасом ниже порога"],
  finance: ["Финансовая выручка","Начисления","Комиссии","Логистика","Прочие расходы","Возвраты","Рекламный расход","Себестоимость","Прибыль до налога","Расчётный налог (6%)","Выручка после налога","Чистая прибыль"],
};
const charts = {
  overview: ["Сумма заказанного","Заказы","Чистая прибыль"],
  sales: ["Заказы","Сумма заказанного","Средний чек"],
  ads: ["Расход","ROAS","Заказы из рекламы"],
  finance: ["Чистая прибыль","Прибыль до налога","Начисления","Расходы Ozon"],
};
const defaults = {
  timezone:"Europe/Moscow", hour:"08:00", baseline:"7", orderDrop:"25", revenueDrop:"25",
  adSpike:"35", roasDrop:"25", stockUnits:"5", stockDays:"7", ratingDrop:"0.2",
  sheets:"", telegram:false, email:false, summary:true,
};
const preferencesKey = "ozon-dashboard-demo-settings-v1";
function loadPreferences() {
  try { return {...defaults,...JSON.parse(localStorage.getItem(preferencesKey) || "{}")}; }
  catch { return {...defaults}; }
}
let settings = loadPreferences();
let preset = "week";
let compare = true;
let startCustom = "";
let endCustom = "";
let selectedMetric = 0;
let tableMode = {};
let toastTimer;
const nav = document.getElementById("nav");
const view = document.getElementById("view");
const toast = document.getElementById("toast");
const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatDay = d => new Intl.DateTimeFormat("ru-RU", {timeZone:"UTC",day:"2-digit",month:"2-digit"}).format(d);
const inputDate = d => d.toISOString().slice(0,10);
function zonedToday(zone=settings.timezone) {
  const parts = new Intl.DateTimeFormat("en", {timeZone:zone,year:"numeric",month:"2-digit",day:"2-digit"})
    .formatToParts(new Date());
  const date = Object.fromEntries(parts.map(({type,value})=>[type,value]));
  return new Date(Date.UTC(+date.year,+date.month-1,+date.day));
}
const shift = (date, offset) => new Date(+date + offset * 86400000);
function range() {
  const today = zonedToday();
  const end = shift(today, -1);
  if(preset === "today") return [today,today];
  if(preset === "month") return [shift(end,-29),end];
  if(preset === "custom" && startCustom && endCustom) return [new Date(startCustom),new Date(endCustom)];
  return [shift(end,-6),end];
}
function pageId() {
  const fromHash = location.hash.slice(1);
  return Object.hasOwn(pages,fromHash) ? fromHash : "overview";
}
function announce(message) {
  toast.textContent = message;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{toast.textContent="";},5500);
}
function buttons(items, attribute, selected) {
  return Object.entries(items).map(([key,label])=>
    `<button type="button" class="btn" ${attribute}="${key}" aria-pressed="${String(key) === String(selected)}">${label}</button>`).join("");
}
function toolbar() {
  const [start,end] = range();
  const span = (+end - +start) / 86400000 + 1;
  const prior = [shift(start,-span),shift(start,-1)];
  return `<div class="toolbar" aria-label="Период отчёта">
    ${buttons({today:"Сегодня",week:"Неделя",month:"Месяц",custom:"Свой период"},"data-period",preset)}
    <label class="check"><input id="compare" type="checkbox" ${compare?"checked":""}>Сравнить с предыдущим</label>
    <span class="dates">${formatDay(start)} — ${formatDay(end)} · ${escape(settings.timezone)}</span>
  </div>
  ${compare ? `<p class="period-caption">Предыдущий период ${formatDay(prior[0])} — ${formatDay(prior[1])}</p>`:""}
  ${preset==="custom" ? `<form class="custom" id="custom">
    <label class="field">С<input name="start" type="date" required value="${inputDate(start)}"></label>
    <label class="field">По<input name="end" type="date" required max="${inputDate(zonedToday())}" value="${inputDate(end)}"></label>
    <button class="btn" type="submit">Применить</button>
  </form>`:""}`;
}
function cards(keys) {
  return `<div class="grid">${keys.map(label=>`<article class="card"><span>${label}</span><strong>Нет данных</strong>
    <small>${compare?"Сравнение: нет данных":"Источник не подключён"}</small></article>`).join("")}</div>`;
}
function chart(page) {
  const [start,end]=range();
  const span=Math.round((+end - +start)/86400000);
  const ticks=Array.from(new Set(Array.from({length:Math.min(7,span+1)},(_,i)=>Math.round(i*span/Math.max(1,Math.min(6,span))))));
  const title=charts[page][selectedMetric] || charts[page][0];
  return `<section class="panel"><div class="panel-head"><h2>Динамика по дням</h2>
    <div class="toolbar">${buttons(charts[page],"data-metric",selectedMetric)}</div></div>
    <div class="chart" aria-label="${title}. Нет данных"><div class="empty"><strong>${title} · нет данных</strong>
    <small>График появится после первой загрузки.</small></div></div>
    <div class="axis" aria-hidden="true">${ticks.map(n=>`<span>${formatDay(shift(start,n))}</span>`).join("")}</div></section>`;
}
function table(title, cols, detail, extras="") {
  return `<section class="panel"><div class="panel-head"><h2>${title}</h2>${extras}</div>
    <div class="scroll" tabindex="0" role="region" aria-label="${title}">
    <table><thead><tr>${cols.map(c=>`<th scope="col">${c}</th>`).join("")}</tr></thead>
    <tbody><tr><td colspan="${cols.length}" class="empty-cell">${detail}</td></tr></tbody></table></div></section>`;
}
function connections() {
  return `<section class="panel"><div class="panel-head"><h2>Подключения</h2></div>
    <div class="source-row"><span>Ozon Seller API</span><span>Не подключён</span></div>
    <div class="source-row"><span>Ozon Performance API</span><span>Не подключён</span></div>
    <div class="source-row"><span>Себестоимость</span><span>${settings.sheets?"Ссылка сохранена":"Нет данных"}</span></div>
    <div class="source-row"><span>Схемы FBO и FBS</span><span>Ожидают проверки</span></div>
    <div class="source-row"><span>Последнее обновление</span><span>Нет данных</span></div></section>`;
}
function textField(label,name,type="text",options="") {
  return `<label class="field">${label}<input type="${type}" name="${name}" value="${escape(settings[name])}" ${options}></label>`;
}
function checkField(label,name) {
  return `<label class="check"><input type="checkbox" name="${name}" ${settings[name]?"checked":""}>${label}</label>`;
}
function settingsPanel() {
  return connections()+`<section class="panel"><div class="panel-head"><h2>Расписание и себестоимость</h2></div>
    <p class="section-note">Настройки сохраняются только в этом браузере.</p>
    <form data-settings="general"><div class="fields">
      ${textField("Часовой пояс","timezone","text","required")}
      ${textField("Утреннее обновление","hour","time","required")}
      ${textField("Ссылка на Google Таблицу","sheets","url","placeholder='https://docs.google.com/spreadsheets/…'")}
    </div><button class="btn primary" type="submit">Сохранить настройки</button></form></section>
    <section class="panel"><div class="panel-head"><h2>Проверка CSV себестоимости</h2></div>
    <p class="section-note">Заголовки <code>offer_id</code>, <code>unit_cost</code>. Для цены с датой добавьте <code>effective_date</code> в формате ГГГГ-ММ-ДД. Файл читается только в браузере.</p>
    <form id="costs" class="toolbar"><label class="field"><span class="sr">Файл себестоимости</span>
      <input name="csv" type="file" accept=".csv,text/csv" required></label><button type="submit" class="btn">Проверить файл</button></form>
    <p id="csv-result" class="muted" role="status"></p></section>`;
}
function alertsPanel() {
  return table("Журнал событий",["Время","Событие","Доставка"],"Событий пока нет.")+
    `<section class="panel"><div class="panel-head"><h2>Правила оповещения</h2></div>
    <p class="section-note">Пороговые значения можно сохранить для демонстрации. Отправка станет доступна после подключения.</p>
    <form data-settings="rules"><div class="fields">
      ${textField("Период сравнения, дней","baseline","number","min=7 max=14 required")}
      ${textField("Падение заказов, %","orderDrop","number","min=1 max=100 required")}
      ${textField("Падение выручки, %","revenueDrop","number","min=1 max=100 required")}
      ${textField("Рост рекламных расходов, %","adSpike","number","min=1 required")}
      ${textField("Падение ROAS, %","roasDrop","number","min=1 max=100 required")}
      ${textField("Критичный остаток, шт.","stockUnits","number","min=0 required")}
      ${textField("Критичный запас, дней","stockDays","number","min=0 required")}
      ${textField("Падение рейтинга, пункты","ratingDrop","number","min=0.01 step=0.01 required")}
    </div><div class="switches">${checkField("Telegram","telegram")}${checkField("Почта","email")}${checkField("Утренняя сводка","summary")}</div>
    <button class="btn primary" type="submit">Сохранить правила</button></form></section>`;
}
function content(page) {
  switch(page) {
    case "overview": return `<div class="twocol">${chart(page)}${connections()}</div>`;
    case "sales": return chart(page)+table("Продажи по дням",["Дата","Заказы","Сумма заказанного","Средний чек","К прошлому периоду"],"Данные появятся после подключения Seller API.");
    case "products": {
      const mode=tableMode.products || "all";
      return table("Продажи по товарам",["Артикул и товар","Сумма заказанного","Штуки","Прибыль","Оценка","Отзывы"],
        "Каталог ещё не загружен.",`<div class="toolbar">${buttons({all:"Все",top:"Топ",bottom:"Аутсайдеры"},"data-mode",mode)}
        <label class="field"><span class="sr">Сортировка товаров</span><select id="product-sort"><option>По выручке</option><option>По штукам</option><option>По прибыли</option></select></label>
        <label class="field"><span class="sr">Поиск по товарам</span><input type="search" class="search" placeholder="Название или артикул"></label></div>`);
    }
    case "ads": {
      const mode=tableMode.ads || "campaigns";
      return chart(page)+table(mode==="campaigns"?"Рекламные кампании":"Товары в рекламе",
        [mode==="campaigns"?"Кампания":"Артикул","Расход","Клики","Заказы","ДРР","ROAS"],"Нет отчётов Performance API.",
        `<div class="toolbar">${buttons({campaigns:"По кампаниям",products:"По товарам"},"data-mode",mode)}</div>`);
    }
    case "inventory": {
      const mode=tableMode.inventory || "products";
      return table(mode==="products"?"Запас по товарам":"Остатки по складам",
        mode==="products"?["Товар","Доступно","Продаж в день","Дней запаса","Оборачиваемость"]:["Склад","Схема","Артикул","Доступно"],
        "Снимок остатков ещё не загружен.",`<div class="toolbar">${buttons({products:"Товары",warehouses:"Склады"},"data-mode",mode)}</div>`);
    }
    case "finance": {
      const mode=tableMode.finance || "days";
      return '<p class="section-note">Расчётный налог — 6% от финансовой выручки. Выручка после налога — финансовая выручка за вычетом этого налога. Чистая прибыль — прибыль до налога за вычетом этого налога.</p>'+chart(page)+table(mode==="days"?"Финансы по дням":"Финансы по товарам",
        [mode==="days"?"Дата":"Артикул","Финансовая выручка","Расходы Ozon","Себестоимость","Налог (6%)","Чистая прибыль"],
        "Прибыль появится после загрузки начислений, сверки рекламы и добавления себестоимости.",
        `<div class="toolbar">${buttons({days:"По дням",products:"По товарам"},"data-mode",mode)}</div>`);
    }
    case "alerts": return alertsPanel();
    default: return settingsPanel();
  }
}
function render() {
  const page=pageId();
  const [label,description]=pages[page];
  document.title=label+" · Дашборд продавца Ozon";
  nav.innerHTML=Object.entries(pages).map(([key,[name,,icon]])=>
    `<a href="#${key}" ${key===page?'aria-current="page"':""}><i aria-hidden="true">${icon}</i>${name}</a>`).join("");
  view.innerHTML=`<header class="head"><div><h1>${label}</h1><p>${description}</p></div>
    <button type="button" class="btn primary" data-refresh>↻ <span>Обновить сейчас</span></button></header>
    ${["alerts","settings","inventory"].includes(page)?"":toolbar()}
    ${page==="overview"?'<div class="banner"><span class="dot" aria-hidden="true"></span><p><strong>Кабинет Ozon не подключён.</strong> Разделы и фильтры доступны для просмотра.</p><a href="#settings">К настройкам</a></div>':""}
    ${metrics[page]?cards(metrics[page]):""}${content(page)}`;
}
function getCsvRows(text) {
  const clean=text.replace(/^\uFEFF/,"");
  const first=clean.split(/\r?\n/,1)[0];
  const delim=first.includes(";")?";":",";
  let field="", row=[], rows=[], quoted=false, closed=false;
  for(let i=0;i<clean.length;i++) {
    const c=clean[i];
    if(quoted) {
      if(c==='"' && clean[i+1]==='"') {field+='"';i++;}
      else if(c==='"') {quoted=false;closed=true;}
      else field+=c;
    } else if(c===delim || c==="\n" || c==="\r") {
      row.push(field.trim());field="";closed=false;
      if(c!==delim) {rows.push(row);row=[];if(c==="\r" && clean[i+1]==="\n") i++;}
    } else if(c==='"' && !field && !closed) quoted=true;
    else if(closed || c==='"') throw Error("Неверный формат кавычек в CSV.");
    else field+=c;
  }
  if(quoted) throw Error("В CSV найдена незакрытая кавычка.");
  row.push(field.trim());rows.push(row);
  return rows.filter(r=>r.some(Boolean));
}
function validateCsv(text) {
  const [header=[],...rows]=getCsvRows(text);
  const names=header.map(s=>s.toLowerCase());
  const offer=names.indexOf("offer_id"), cost=names.indexOf("unit_cost"), effective=names.indexOf("effective_date");
  if(offer<0 || cost<0 || new Set(names).size!==names.length) throw Error("Проверьте заголовки offer_id и unit_cost.");
  if(!rows.length) throw Error("В CSV нет строк с себестоимостью.");
  const seen=new Set();
  for(const [i,row] of rows.entries()) {
    const value=row[cost]?.replace(",",".");
    const day=(effective>=0 && row[effective]) || "1900-01-01";
    const date=new Date(day);
    const key=JSON.stringify([row[offer],day]);
    if(row.length!==names.length || !row[offer] || !/^\d+(\.\d{1,4})?$/.test(value || "") ||
       !/^\d{4}-\d{2}-\d{2}$/.test(day) || !Number.isFinite(+date) || inputDate(date)!==day || seen.has(key)) {
      throw Error(`Строка данных ${i+1}: проверьте артикул, цену, дату и дубли.`);
    }
    seen.add(key);
  }
  return rows.length;
}
function restoreButton(selector) {
  render();
  view.querySelector(selector)?.focus();
}
view.addEventListener("click",event=>{
  const btn=event.target.closest("button");
  if(!btn) return;
  if(btn.hasAttribute("data-refresh")) {
    announce("Кабинет Ozon ещё не подключён. В демо загрузка не запускается.");
  } else if(btn.dataset.period) {
    preset=btn.dataset.period;
    restoreButton(`[data-period="${preset}"]`);
  } else if(btn.dataset.metric!==undefined) {
    selectedMetric=Number(btn.dataset.metric);
    restoreButton(`[data-metric="${selectedMetric}"]`);
  } else if(btn.dataset.mode) {
    tableMode[pageId()]=btn.dataset.mode;
    restoreButton(`[data-mode="${btn.dataset.mode}"]`);
  }
});
view.addEventListener("change",event=>{
  if(event.target.id==="compare") {
    compare=event.target.checked;
    restoreButton("#compare");
  }
});
view.addEventListener("submit",async event=>{
  event.preventDefault();
  const form=event.target;
  const submitted=new FormData(form);
  if(form.id==="custom") {
    const start=submitted.get("start"),end=submitted.get("end");
    if(!start || !end || start>end || end>inputDate(zonedToday()) || (+new Date(end)-+new Date(start))/86400000>365) {
      announce("Выберите период до 366 дней, без будущих дат.");return;
    }
    startCustom=start;endCustom=end;render();
  } else if(form.id==="costs") {
    const display=document.getElementById("csv-result");
    const file=submitted.get("csv");
    try {
      if(!file || !file.size) throw Error("Выберите CSV с себестоимостью.");
      if(file.size>2*1024*1024) throw Error("Размер CSV должен быть до 2 МБ.");
      const text=new TextDecoder("utf-8",{fatal:true}).decode(await file.arrayBuffer());
      display.textContent=`Проверено строк: ${validateCsv(text)}. Файл не отправлен и не сохранён.`;
    } catch(error) { display.textContent=error instanceof TypeError?"Сохраните CSV в кодировке UTF-8.":error.message; }
  } else if(form.dataset.settings) {
    const next={...settings,...Object.fromEntries(submitted)};
    if(form.dataset.settings==="general") {
      try { zonedToday(next.timezone); } catch { announce("Введите часовой пояс, например Europe/Moscow.");return; }
      if(next.sheets && !/^https:\/\/docs\.google\.com\/spreadsheets\/d\/[A-Za-z0-9_-]+(?:[/#?].*)?$/.test(next.sheets)) {
        announce("Введите ссылку на Google Таблицу.");return;
      }
    } else {
      for(const key of ["telegram","email","summary"]) next[key]=submitted.has(key);
    }
    settings=next;
    try {
      localStorage.setItem(preferencesKey,JSON.stringify(settings));
      announce("Настройки сохранены в этом браузере.");
    } catch { announce("Настройки действуют до закрытия страницы."); }
    render();
  }
});
window.addEventListener("hashchange",()=>{selectedMetric=0;render();window.scrollTo(0,0);});
render();
</script>
